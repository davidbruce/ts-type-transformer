<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Renderer & Walker — Marked + Gleam</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #ffffff; color: #111111; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      #app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111111; padding-bottom: 10px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .badge { font-size: 11px; color: #111111; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
      .card { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
      .label { font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; }
      .md-out { padding: 12px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; color: #111111; font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; }
      .md-out h1, .md-out h2 { margin: 0 0 8px; color: #000000; }
      .md-out p { margin: 0; }
      .md-out code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: #f2f2f2; padding: 1px 4px; border-radius: 3px; color: #111111; }
      .wire-h { color: #000000; border-left: 3px solid #111111; padding-left: 8px; }
      .tok-strip { display: flex; flex-wrap: wrap; gap: 6px; }
      .tok-pill { font-size: 11px; background: #f7f7f7; color: #111111; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
