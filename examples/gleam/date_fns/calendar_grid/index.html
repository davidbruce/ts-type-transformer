<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Grid — date-fns + Gleam</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #ffffff; color: #111111; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      #app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111111; padding-bottom: 10px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .badge { font-size: 11px; color: #111111; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
      .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .metric { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
      .metric .val { font-size: 15px; font-weight: 600; color: #111111; }
      .card { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .label { font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
      .dow { font-size: 11px; color: #555555; text-transform: uppercase; text-align: center; padding: 4px 0; border-bottom: 1px solid #d4d4d4; }
      .day-cell { min-height: 54px; padding: 6px 8px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; display: flex; flex-direction: column; justify-content: space-between; }
      .day-cell.empty { background: transparent; border: 1px dashed #e0e0e0; }
      .day-cell.weekend { background: #f2f2f2; color: #555555; }
      .day-cell.today { background: #111111; border-color: #111111; color: #ffffff; }
      .day-cell.today .sub { color: #d4d4d4; }
      .day-num { font-size: 14px; font-weight: 600; }
      .sub { font-size: 10px; color: #666666; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
