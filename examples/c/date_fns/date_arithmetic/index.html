<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Arithmetic &amp; Durations — date-fns + C</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #ffffff; color: #111111; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      #app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111111; padding-bottom: 10px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .badge { font-size: 11px; color: #111111; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
      .card { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .label { font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; }
      table { width: 100%; border-collapse: collapse; background: #ffffff; border: 1px solid #d4d4d4; }
      th, td { border: 1px solid #d4d4d4; padding: 7px 10px; text-align: left; font-size: 12px; vertical-align: top; }
      th { background: #efefef; font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.04em; }
      code { font-family: inherit; background: #efefef; padding: 1px 4px; border-radius: 3px; }
      .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
      .kv { background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
      .kv strong { font-size: 13px; color: #111111; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
