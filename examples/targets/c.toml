# Example target: flat functions over opaque handles. Everything is lowered.
[constructs]
classes = "pair"
type_ops = "evaluate"
intersections = "merge"
generics = "erase"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
optional_params = "overloads"
union_params = "overloads"
unions = "erase"
overloads = "rename"
keyed_params = "expand"
