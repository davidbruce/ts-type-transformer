# Example target: flat functions over opaque handles. Everything is lowered.
[constructs]
classes = "pair"
type_ops = "evaluate"
aliases = "expand"
intersections = "merge"
generics = "erase"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
union_params = "overloads"
unions = "name"
overloads = "rename"
keyed_params = "expand"
redeclarations = "drop"
