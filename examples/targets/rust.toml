# Example target: Rust over wasm32. Inheritance becomes traits, generics are
# kept, unions are enums, optional parameters Option; Rust has no
# overloading, so same-named members are renamed.
[constructs]
classes = "pair"
type_ops = "evaluate"
intersections = "merge"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
unions = "name"
overloads = "rename"
keyed_params = "map"
redeclarations = "drop"
