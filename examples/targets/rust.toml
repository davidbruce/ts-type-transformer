# Example target: Rust over wasm32. Inheritance becomes traits, generics are
# kept, unions are enums, optional and nullable parameters a value or None;
# Rust has no overloading, so same-named members are renamed.
[constructs]
classes = "pair"
type_ops = "evaluate"
aliases = "expand"
constraints = "exact"
intersections = "merge"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
unions = "name"
overloads = "rename"
keyed_params = "map"
redeclarations = "drop"
