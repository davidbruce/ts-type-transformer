# Example target: Gleam on JavaScript. Functions and custom types, generics
# without constraints, subtypes as phantom types; no methods, overloads or optional arguments:
# members are functions of their type's, an optional argument an Option.
[constructs]
classes = "pair"
type_ops = "evaluate"
aliases = "expand"
intersections = "merge"
generics = "checking"
inheritance = "keep"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
overloads = "rename"
keyed_params = "map"
unions = "name"
