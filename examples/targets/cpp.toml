# Example target: C++. Inheritance, overloads and union parameters stay;
# literals become enum classes, unions std::variant, nullables std::optional,
# keyed signatures templates over typed keys.
[constructs]
classes = "pair"
type_ops = "evaluate"
aliases = "expand"
constraints = "nominal"
intersections = "merge"
nullable = "wrap"
literals = "enum"
anonymous = "hoist"
optional_params = "overloads"
unions = "name"
keyed_params = "map"
redeclarations = "drop"
