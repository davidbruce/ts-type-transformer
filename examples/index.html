<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examples — tsrs_proto</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f7f7f7;
        --surface-2: #efefef;
        --border: #d4d4d4;
        --border-strong: #111111;
        --text: #111111;
        --muted: #555555;
        --inv-bg: #111111;
        --inv-text: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      #top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .brand-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #total-summary {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      #lang-tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
      }
      .lang-tab {
        appearance: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid #c4c4c4;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      .lang-tab:hover {
        background: var(--surface-2);
        border-color: var(--border-strong);
      }
      .lang-tab.active {
        background: var(--inv-bg);
        color: var(--inv-text);
        border-color: var(--border-strong);
      }
      .tab-count {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .lang-tab.active .tab-count {
        color: #d4d4d4;
      }
      #layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      #sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side-head {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .side-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      #target-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #count {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: #333333;
        background: var(--bg);
        border: 1px solid #c4c4c4;
        border-radius: 3px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      #filter {
        width: 100%;
        padding: 7px 10px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 3px;
        font-size: 13px;
        outline: none;
      }
      #filter:focus {
        border-color: var(--border-strong);
      }
      #nav {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 18px;
      }
      .pkg-group {
        margin-bottom: 14px;
      }
      .pkg-heading {
        margin: 0 0 6px;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .demo-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        margin: 2px 0;
        border-radius: 3px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        border: 1px solid transparent;
      }
      .demo-link:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }
      .demo-link.active {
        background: var(--inv-bg);
        border-color: var(--border-strong);
        color: var(--inv-text);
      }
      .demo-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .demo-ind {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 10px;
      }
      .demo-kind {
        border: 1px solid #c4c4c4;
        border-radius: 2px;
        padding: 0 4px;
        color: var(--muted);
      }
      .demo-link.active .demo-kind {
        border-color: #777777;
        color: #e5e5e5;
      }
      .demo-dot {
        font-size: 10px;
        line-height: 1;
      }
      .demo-dot.is-ready {
        color: #111111;
      }
      .demo-dot.is-pending {
        color: #999999;
      }
      .demo-link.active .demo-dot.is-ready {
        color: #ffffff;
      }
      .demo-link.active .demo-dot.is-pending {
        color: #a3a3a3;
      }
      .side-foot {
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        color: var(--muted);
        background: var(--bg);
        line-height: 1.45;
      }
      .side-foot code {
        color: var(--text);
        font-weight: 600;
      }
      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .bar-meta {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .pill {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: #333333;
        background: var(--bg);
        border: 1px solid #c4c4c4;
        border-radius: 3px;
        padding: 2px 6px;
        white-space: nowrap;
      }
      .pill.is-ready {
        border-color: var(--border-strong);
        color: var(--text);
      }
      .pill.is-pending {
        color: var(--muted);
      }
      #active-title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      #active-desc {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .btn {
        appearance: none;
        background: var(--bg);
        color: var(--text);
        border: 1px solid #c4c4c4;
        border-radius: 3px;
        padding: 5px 10px;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--border-strong);
        background: var(--surface-2);
      }
      #viewport-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #viewer {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--bg);
      }
      #node-card {
        padding: 24px;
        height: 100%;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        background: var(--bg);
      }
      #node-card pre {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 14px;
        overflow-x: auto;
      }
      #node-card pre.cv-code {
        background: var(--bg);
        padding: 8px 0;
      }
      #source-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(680px, 60%);
        background: var(--surface);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.88);
        z-index: 10;
        pointer-events: none;
      }
      #loading-box {
        padding: 10px 14px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 3px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
      }
      #loading[hidden],
      #source-drawer[hidden],
      #node-card[hidden],
      #viewer[hidden],
      #active-status[hidden] {
        display: none;
      }
      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
      }
      .drawer-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      #source-code {
        margin: 0;
        padding: 10px 0;
        flex: 1;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        line-height: 1.55;
        background: var(--bg);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <header id="top-bar">
        <div class="brand-wrap">
          <span class="brand-title">tsrs_proto · Examples</span>
          <span id="total-summary">Loading...</span>
        </div>
        <nav id="lang-tabs" aria-label="Language Selector"></nav>
      </header>
      <div id="layout">
        <aside id="sidebar">
          <div class="side-head">
            <div class="side-title-row">
              <h1 id="target-title">Loading...</h1>
              <span id="count">0</span>
            </div>
            <input id="filter" type="search" placeholder="Filter package or demo..." />
          </div>
          <nav id="nav"></nav>
          <div class="side-foot">
            Pre-build: <code id="prebuild-cmd">npm run precompile:c</code><br />
            All targets: <code>npm run precompile</code>
          </div>
        </aside>
        <main id="stage">
          <header id="bar">
            <div class="bar-meta">
              <span id="active-target" class="pill"></span>
              <span id="active-pkg" class="pill"></span>
              <span id="active-title">Loading...</span>
              <span id="active-desc"></span>
            </div>
            <div class="bar-actions">
              <span id="active-status" class="pill" hidden></span>
              <button id="view-source-btn" class="btn" type="button">View Source</button>
              <a id="open-direct" class="btn" href="#" target="_blank" rel="noopener">Open Direct</a>
            </div>
          </header>
          <div id="viewport-wrap">
            <iframe id="viewer" title="Demo Viewer"></iframe>
            <div id="loading" hidden>
              <div id="loading-box">Loading demo...</div>
            </div>
            <div id="node-card" hidden>
              <p id="node-desc"></p>
              <pre id="node-cmd"></pre>
              <pre id="node-source"></pre>
            </div>
            <aside id="source-drawer" hidden>
              <div class="drawer-head">
                <span id="source-path"></span>
                <div class="drawer-actions">
                  <button id="copy-source" class="btn" type="button">Copy</button>
                  <button id="close-source" class="btn" type="button">Close</button>
                </div>
              </div>
              <pre id="source-code"></pre>
            </aside>
          </div>
        </main>
      </div>
    </div>
    <script type="module">
      import { langFromSource, renderCode } from './code_viewer.mjs';

      const TARGET_META = [
        { id: 'c', shortLabel: 'C' },
        { id: 'cpp', shortLabel: 'C++' },
        { id: 'zig', shortLabel: 'Zig' },
        { id: 'rust', shortLabel: 'Rust' },
        { id: 'gleam', shortLabel: 'Gleam' },
        { id: 'fsharp', shortLabel: 'F#' },
      ];
      const TARGET_IDS = TARGET_META.map(t => t.id);

      const totalSummaryEl = document.getElementById('total-summary');
      const langTabsEl = document.getElementById('lang-tabs');
      const targetTitleEl = document.getElementById('target-title');
      const countEl = document.getElementById('count');
      const filterInput = document.getElementById('filter');
      const navEl = document.getElementById('nav');
      const prebuildCmdEl = document.getElementById('prebuild-cmd');
      const activeTargetEl = document.getElementById('active-target');
      const activePkgEl = document.getElementById('active-pkg');
      const activeTitleEl = document.getElementById('active-title');
      const activeDescEl = document.getElementById('active-desc');
      const activeStatusEl = document.getElementById('active-status');
      const openDirectEl = document.getElementById('open-direct');
      const viewerEl = document.getElementById('viewer');
      const loadingEl = document.getElementById('loading');
      const loadingBoxEl = document.getElementById('loading-box');
      const nodeCardEl = document.getElementById('node-card');
      const nodeDescEl = document.getElementById('node-desc');
      const nodeCmdEl = document.getElementById('node-cmd');
      const nodeSourceEl = document.getElementById('node-source');
      const sourceDrawerEl = document.getElementById('source-drawer');
      const sourcePathEl = document.getElementById('source-path');
      const sourceCodeEl = document.getElementById('source-code');
      const viewSourceBtn = document.getElementById('view-source-btn');
      const copySourceBtn = document.getElementById('copy-source');
      const closeSourceBtn = document.getElementById('close-source');

      const manifests = new Map();
      await Promise.all(
        TARGET_META.map(async t => {
          const res = await fetch(`./${t.id}/examples.json`);
          manifests.set(t.id, await res.json());
        }),
      );

      let statusSupported = false;
      const statusByTarget = new Map();

      async function fetchStatusAll() {
        try {
          const res = await fetch('./__api/status', { cache: 'no-store' });
          if (!res.ok) return;
          const data = await res.json();
          if (Array.isArray(data?.targets)) {
            statusSupported = true;
            for (const st of data.targets) {
              statusByTarget.set(st.id, st);
            }
          }
        } catch {
          statusSupported = false;
        }
      }

      async function refreshTargetStatus(targetId) {
        if (!statusSupported) return;
        try {
          const res = await fetch(`./__api/status?target=${encodeURIComponent(targetId)}`, {
            cache: 'no-store',
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data?.target) {
            statusByTarget.set(targetId, data.target);
          }
        } catch {
          // Ignore transient status fetch errors.
        }
      }

      function targetRelPath(targetId, relPath) {
        return `./${targetId}/${relPath.replace(/^\.\//, '')}`;
      }

      function parseHash(rawHash) {
        const cleaned = (rawHash ?? '').replace(/^#\/?/, '').trim();
        if (!cleaned) return { targetId: null, demoId: null };
        const slashIdx = cleaned.indexOf('/');
        const head = slashIdx === -1 ? cleaned : cleaned.slice(0, slashIdx);
        const rest = slashIdx === -1 ? '' : cleaned.slice(slashIdx + 1);
        if (TARGET_IDS.includes(head)) {
          return { targetId: head, demoId: rest || null };
        }
        return { targetId: null, demoId: cleaned };
      }

      let currentTarget = null;
      let currentItem = null;
      let activeSeq = 0;
      let activeLoadCleanup = null;

      function updateSummaryAndCounts() {
        const totalAll = TARGET_META.reduce(
          (sum, t) => sum + (manifests.get(t.id)?.examples.length ?? 0),
          0,
        );
        if (statusSupported) {
          const compiledAll = TARGET_META.reduce(
            (sum, t) => sum + (statusByTarget.get(t.id)?.compiled ?? 0),
            0,
          );
          totalSummaryEl.textContent = `${compiledAll}/${totalAll} pre-compiled`;
        } else {
          totalSummaryEl.textContent = `${totalAll} examples · ${TARGET_META.length} targets`;
        }

        const manifest = manifests.get(currentTarget);
        const st = statusByTarget.get(currentTarget);
        if (manifest) {
          countEl.textContent =
            statusSupported && st
              ? `${st.compiled}/${st.total} built`
              : `${manifest.examples.length} examples`;
        }
      }

      function renderLangTabs() {
        langTabsEl.innerHTML = '';
        for (const meta of TARGET_META) {
          const manifest = manifests.get(meta.id);
          const st = statusByTarget.get(meta.id);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'lang-tab' + (currentTarget === meta.id ? ' active' : '');
          btn.dataset.target = meta.id;

          const nameSpan = document.createElement('span');
          nameSpan.textContent = meta.shortLabel;
          btn.appendChild(nameSpan);

          const countSpan = document.createElement('span');
          countSpan.className = 'tab-count';
          if (statusSupported && st) {
            countSpan.textContent = `${st.compiled}/${st.total}`;
            btn.title = `${manifest.label} — ${st.browserCompiled}/${st.browserTotal} browser, ${st.nodeCompiled}/${st.nodeTotal} cli built`;
          } else {
            countSpan.textContent = String(manifest.examples.length);
            btn.title = manifest.label;
          }
          btn.appendChild(countSpan);

          btn.addEventListener('click', () => {
            if (meta.id === currentTarget) return;
            const targetManifest = manifests.get(meta.id);
            const match =
              (currentItem && targetManifest.examples.find(e => e.id === currentItem.id)) ??
              targetManifest.examples[0];
            if (match) {
              location.hash = `#${meta.id}/${match.id}`;
            } else {
              location.hash = `#${meta.id}`;
            }
          });
          langTabsEl.appendChild(btn);
        }
        updateSummaryAndCounts();
      }

      function renderNav(query) {
        const manifest = manifests.get(currentTarget);
        if (!manifest) return;
        const st = statusByTarget.get(currentTarget);
        const q = query.trim().toLowerCase();
        const groups = new Map();

        for (const item of manifest.examples) {
          if (
            q &&
            !item.id.toLowerCase().includes(q) &&
            !item.title.toLowerCase().includes(q) &&
            !item.package.toLowerCase().includes(q) &&
            !(item.description ?? '').toLowerCase().includes(q)
          ) {
            continue;
          }
          if (!groups.has(item.package)) groups.set(item.package, []);
          groups.get(item.package).push(item);
        }

        navEl.innerHTML = '';
        for (const [pkg, items] of groups) {
          const section = document.createElement('section');
          section.className = 'pkg-group';
          const h = document.createElement('h2');
          h.className = 'pkg-heading';
          h.textContent = pkg;
          section.appendChild(h);

          for (const item of items) {
            const a = document.createElement('a');
            a.className = 'demo-link' + (currentItem?.id === item.id ? ' active' : '');
            a.href = `#${currentTarget}/${item.id}`;
            a.dataset.id = item.id;

            const titleSpan = document.createElement('span');
            titleSpan.className = 'demo-title';
            titleSpan.textContent = item.title;
            a.appendChild(titleSpan);

            const indSpan = document.createElement('span');
            indSpan.className = 'demo-ind';
            if (item.kind === 'node') {
              const kindBadge = document.createElement('span');
              kindBadge.className = 'demo-kind';
              kindBadge.textContent = 'cli';
              indSpan.appendChild(kindBadge);
            }
            if (statusSupported && st) {
              const dot = document.createElement('span');
              const isReady = Boolean(st.items?.[item.id]);
              dot.className = 'demo-dot ' + (isReady ? 'is-ready' : 'is-pending');
              dot.textContent = isReady ? '●' : '○';
              dot.title = isReady ? 'Pre-compiled' : 'Not compiled yet';
              indSpan.appendChild(dot);
            }
            if (indSpan.childNodes.length > 0) {
              a.appendChild(indSpan);
            }

            section.appendChild(a);
          }
          navEl.appendChild(section);
        }
      }

      function updateNavItemStatus(itemId, isReady) {
        const link = [...navEl.querySelectorAll('.demo-link')].find(el => el.dataset.id === itemId);
        if (!link) return;
        const dot = link.querySelector('.demo-dot');
        if (!dot) return;
        dot.className = 'demo-dot ' + (isReady ? 'is-ready' : 'is-pending');
        dot.textContent = isReady ? '●' : '○';
        dot.title = isReady ? 'Pre-compiled' : 'Not compiled yet';
      }

      function updateActiveStatusPill(item) {
        const st = statusByTarget.get(currentTarget);
        if (!statusSupported || !st || !item) {
          activeStatusEl.hidden = true;
          return;
        }
        const isReady = Boolean(st.items?.[item.id]);
        activeStatusEl.hidden = false;
        activeStatusEl.textContent = isReady ? 'pre-compiled' : 'on-demand';
        activeStatusEl.className = 'pill ' + (isReady ? 'is-ready' : 'is-pending');
      }

      async function activate(targetId, demoId) {
        const targetChanged = targetId !== currentTarget;
        currentTarget = targetId;
        const manifest = manifests.get(targetId);
        const item = manifest.examples.find(e => e.id === demoId) ?? manifest.examples[0];
        if (!item) return;

        const seq = ++activeSeq;
        if (activeLoadCleanup) {
          activeLoadCleanup();
          activeLoadCleanup = null;
        }

        currentItem = item;
        document.title = `${manifest.label} · ${item.title} — tsrs_proto`;
        targetTitleEl.textContent = manifest.label;
        prebuildCmdEl.textContent = `npm run precompile:${targetId}`;
        sourceDrawerEl.hidden = true;
        activeTargetEl.textContent = targetId;
        activePkgEl.textContent = item.package;
        activeTitleEl.textContent = item.title;
        activeDescEl.textContent = item.description ?? '';
        updateActiveStatusPill(item);

        const itemUrlRel = targetRelPath(targetId, item.kind === 'node' ? item.source : item.path);
        openDirectEl.href = new URL(itemUrlRel, location.href).href;

        if (targetChanged) {
          renderLangTabs();
          renderNav(filterInput.value);
        } else {
          for (const el of navEl.querySelectorAll('.demo-link')) {
            el.classList.toggle('active', el.dataset.id === item.id);
          }
          updateSummaryAndCounts();
        }

        const expectedHash = `#${targetId}/${item.id}`;
        if (location.hash !== expectedHash) {
          history.replaceState(null, '', expectedHash);
        }

        const st = statusByTarget.get(targetId);
        const isCompiled = statusSupported && st ? Boolean(st.items?.[item.id]) : null;

        if (item.kind === 'node') {
          loadingEl.hidden = true;
          viewerEl.hidden = true;
          viewerEl.removeAttribute('src');
          nodeCardEl.hidden = false;
          nodeDescEl.textContent = `${item.title} (${manifest.label}) — Node benchmark / CLI example`;
          const baseCmd = `cd ${targetId} && ${item.command ?? `node ./${item.package}/...`}`;
          nodeCmdEl.textContent =
            isCompiled === false
              ? `# Pre-compile first:\nnpm run precompile -- ${targetId}:${item.id}\n\n# Run:\n${baseCmd}`
              : baseCmd;
          const srcText = await (await fetch(targetRelPath(targetId, item.source))).text();
          if (seq !== activeSeq) return;
          renderCode(nodeSourceEl, srcText, langFromSource(targetId, item.source));
          window.__galleryReady = {
            target: manifest.target,
            label: manifest.label,
            count: manifest.examples.length,
            activeId: item.id,
            targets: TARGET_IDS,
          };
          return;
        }

        nodeCardEl.hidden = true;
        viewerEl.hidden = false;
        loadingBoxEl.textContent =
          isCompiled === true
            ? `Loading pre-compiled ${manifest.label} · ${item.id}...`
            : isCompiled === false
              ? `Compiling ${manifest.label} · ${item.id} on demand...`
              : `Loading ${manifest.label} · ${item.id}...`;
        loadingEl.hidden = false;

        await new Promise(resolve => {
          const cleanup = () => {
            viewerEl.removeEventListener('load', onLoad);
          };
          const onLoad = () => {
            cleanup();
            activeLoadCleanup = null;
            resolve();
          };
          activeLoadCleanup = () => {
            cleanup();
            resolve();
          };
          viewerEl.addEventListener('load', onLoad);
          viewerEl.src = new URL(targetRelPath(targetId, item.path), location.href).href;
        });

        if (seq !== activeSeq) return;
        loadingEl.hidden = true;

        if (statusSupported) {
          await refreshTargetStatus(targetId);
          if (seq !== activeSeq) return;
          const refreshed = statusByTarget.get(targetId);
          updateNavItemStatus(item.id, Boolean(refreshed?.items?.[item.id]));
          updateActiveStatusPill(item);
          renderLangTabs();
        }

        window.__galleryReady = {
          target: manifest.target,
          label: manifest.label,
          count: manifest.examples.length,
          activeId: item.id,
          targets: TARGET_IDS,
        };
      }

      viewSourceBtn.addEventListener('click', async () => {
        if (!currentItem || !currentTarget) return;
        sourcePathEl.textContent = `${currentTarget}/${currentItem.source.replace(/^\.\//, '')}`;
        sourceCodeEl.classList.remove('cv-code');
        sourceCodeEl.textContent = 'Loading...';
        sourceDrawerEl.hidden = false;
        const srcText = await (await fetch(targetRelPath(currentTarget, currentItem.source))).text();
        renderCode(sourceCodeEl, srcText, langFromSource(currentTarget, currentItem.source));
      });

      copySourceBtn.addEventListener('click', async () => {
        const text = sourceCodeEl.dataset.rawSource ?? sourceCodeEl.textContent ?? '';
        if (!text) return;
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            copied = true;
          } catch {
            copied = false;
          }
        }
        if (!copied) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            copied = document.execCommand('copy');
          } catch {
            copied = false;
          }
          ta.remove();
        }
        if (copied) {
          copySourceBtn.textContent = 'Copied';
          setTimeout(() => {
            if (copySourceBtn.textContent === 'Copied') copySourceBtn.textContent = 'Copy';
          }, 1200);
        }
      });

      closeSourceBtn.addEventListener('click', () => {
        sourceDrawerEl.hidden = true;
      });

      filterInput.addEventListener('input', () => renderNav(filterInput.value));

      window.addEventListener('hashchange', () => {
        const parsed = parseHash(location.hash);
        const targetId = parsed.targetId ?? currentTarget ?? TARGET_IDS[0];
        activate(targetId, parsed.demoId);
      });

      await fetchStatusAll();
      const initial = parseHash(location.hash);
      const defaultTarget =
        initial.targetId ??
        (statusSupported
          ? TARGET_IDS.find(id => (statusByTarget.get(id)?.browserCompiled ?? 0) > 0)
          : null) ??
        TARGET_IDS[0];
      await activate(defaultTarget, initial.demoId);
    </script>
  </body>
</html>
