<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested Polygon Zones — Leaflet + F#</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #ffffff; color: #111111; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      #app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111111; padding-bottom: 10px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .badge { font-size: 11px; color: #111111; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
      .card { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .label { font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; }
      .map-box { width: 680px; height: 400px; position: relative; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; overflow: hidden; }
      .meta { font-size: 12px; color: #555555; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; padding: 8px 10px; }
      .leaflet-container { position: relative; overflow: hidden; outline: 0; background: #ffffff; font: inherit; }
      .leaflet-pane, .leaflet-map-pane, .leaflet-overlay-pane, .leaflet-marker-pane, .leaflet-tooltip-pane, .leaflet-popup-pane, .leaflet-pane > svg { position: absolute; left: 0; top: 0; }
      .leaflet-overlay-pane { z-index: 400; }
      .leaflet-marker-pane { z-index: 600; }
      .leaflet-tooltip-pane { z-index: 650; }
      .leaflet-popup-pane { z-index: 700; }
      .leaflet-top { position: absolute; top: 8px; z-index: 1000; pointer-events: none; }
      .leaflet-left { left: 8px; }
      .leaflet-control { pointer-events: auto; }
      .leaflet-bar { border: 1px solid #b5b5b5; border-radius: 3px; background: #ffffff; overflow: hidden; }
      .leaflet-bar a { display: block; width: 24px; height: 24px; line-height: 22px; text-align: center; text-decoration: none; color: #111111; font-weight: 600; border-bottom: 1px solid #d4d4d4; }
      .leaflet-bar a:last-child { border-bottom: none; }
      .mono-pin { background: transparent; border: none; }
      .mono-pin span { width: 22px; height: 22px; border-radius: 3px; background: #111111; color: #ffffff; border: 1px solid #ffffff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; }
      .leaflet-popup { position: absolute; margin-bottom: 14px; text-align: center; }
      .leaflet-popup-content-wrapper { background: #ffffff; color: #111111; border: 1px solid #111111; border-radius: 3px; padding: 1px; text-align: left; }
      .leaflet-popup-content { margin: 7px 11px; font-size: 11px; white-space: nowrap; }
      .leaflet-popup-close-button { position: absolute; top: 2px; right: 5px; color: #555555; text-decoration: none; font-size: 13px; }
      .leaflet-tooltip { position: absolute; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; color: #111111; padding: 2px 6px; font-size: 11px; white-space: nowrap; pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="head">
        <h1>Leaflet  Nested Polygon Zones (F#)</h1>
        <span class="badge">leaflet · polygons · bounds</span>
      </div>
      <div class="card">
        <div class="label">Hull Rectangle · Nested Polygons · Bounds Containment Probes</div>
        <div id="map" class="map-box"></div>
        <div id="meta" class="meta">Initializing Leaflet vector map...</div>
      </div>
    </main>
    <script type="module" src="./js/Program.mjs"></script>
  </body>
</html>
