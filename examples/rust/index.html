<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsrs_proto Examples</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: #111827;
        --border: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        width: 100%;
        height: 100%;
      }
      #sidebar {
        background: var(--panel);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .side-head {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
      }
      .side-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      #target-title {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #count {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      #filter {
        width: 100%;
        padding: 7px 10px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        outline: none;
      }
      #filter:focus {
        border-color: var(--accent);
      }
      #nav {
        flex: 1;
        overflow-y: auto;
        padding: 10px 10px 18px;
      }
      .pkg-group {
        margin-bottom: 14px;
      }
      .pkg-heading {
        margin: 0 0 6px;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .demo-link {
        display: block;
        padding: 7px 10px;
        margin: 2px 0;
        border-radius: 6px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        border: 1px solid transparent;
      }
      .demo-link:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border);
      }
      .demo-link.active {
        background: rgba(96, 165, 250, 0.14);
        border-color: rgba(96, 165, 250, 0.45);
        color: #fff;
      }
      #stage {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .bar-meta {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      #active-pkg {
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: var(--accent);
        border: 1px solid rgba(96, 165, 250, 0.35);
        border-radius: 4px;
        padding: 2px 6px;
      }
      #active-title {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      #active-desc {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .btn {
        appearance: none;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        text-decoration: none;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      #viewport-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #viewer {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--bg);
      }
      #node-card {
        padding: 24px;
        height: 100%;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
      }
      #node-card pre {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px;
        overflow-x: auto;
      }
      #source-drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(560px, 55%);
        background: var(--panel);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      #source-drawer[hidden],
      #node-card[hidden],
      #viewer[hidden] {
        display: none;
      }
      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
      }
      #source-code {
        margin: 0;
        padding: 14px;
        flex: 1;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        line-height: 1.5;
        background: var(--bg);
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <div class="side-head">
          <div class="side-title-row">
            <h1 id="target-title">tsrs examples</h1>
            <span id="count">0</span>
          </div>
          <input id="filter" type="search" placeholder="Filter package or demo..." />
        </div>
        <nav id="nav"></nav>
      </aside>
      <main id="stage">
        <header id="bar">
          <div class="bar-meta">
            <span id="active-pkg"></span>
            <span id="active-title">Loading...</span>
            <span id="active-desc"></span>
          </div>
          <div class="bar-actions">
            <button id="view-source-btn" class="btn" type="button">View Source</button>
            <a id="open-direct" class="btn" href="#" target="_blank" rel="noopener">Open Direct</a>
          </div>
        </header>
        <div id="viewport-wrap">
          <iframe id="viewer" title="Demo Viewer"></iframe>
          <div id="node-card" hidden>
            <p id="node-desc"></p>
            <pre id="node-cmd"></pre>
            <pre id="node-source"></pre>
          </div>
          <aside id="source-drawer" hidden>
            <div class="drawer-head">
              <span id="source-path"></span>
              <button id="close-source" class="btn" type="button">Close</button>
            </div>
            <pre id="source-code"></pre>
          </aside>
        </div>
      </main>
    </div>
    <script type="module">
      const res = await fetch('./examples.json');
      const manifest = await res.json();
      const targetTitle = document.getElementById('target-title');
      const countEl = document.getElementById('count');
      const filterInput = document.getElementById('filter');
      const nav = document.getElementById('nav');
      const activePkg = document.getElementById('active-pkg');
      const activeTitle = document.getElementById('active-title');
      const activeDesc = document.getElementById('active-desc');
      const openDirect = document.getElementById('open-direct');
      const viewer = document.getElementById('viewer');
      const nodeCard = document.getElementById('node-card');
      const nodeDesc = document.getElementById('node-desc');
      const nodeCmd = document.getElementById('node-cmd');
      const nodeSource = document.getElementById('node-source');
      const sourceDrawer = document.getElementById('source-drawer');
      const sourcePath = document.getElementById('source-path');
      const sourceCode = document.getElementById('source-code');
      const viewSourceBtn = document.getElementById('view-source-btn');
      const closeSourceBtn = document.getElementById('close-source');

      document.title = `${manifest.label} Examples — tsrs_proto`;
      targetTitle.textContent = manifest.label;
      countEl.textContent = `${manifest.examples.length} examples`;

      let current = null;

      function renderNav(query) {
        const q = query.trim().toLowerCase();
        const groups = new Map();
        for (const item of manifest.examples) {
          if (
            q &&
            !item.id.toLowerCase().includes(q) &&
            !item.title.toLowerCase().includes(q) &&
            !item.package.toLowerCase().includes(q) &&
            !(item.description ?? '').toLowerCase().includes(q)
          ) {
            continue;
          }
          if (!groups.has(item.package)) groups.set(item.package, []);
          groups.get(item.package).push(item);
        }
        nav.innerHTML = '';
        for (const [pkg, items] of groups) {
          const section = document.createElement('section');
          section.className = 'pkg-group';
          const h = document.createElement('h2');
          h.className = 'pkg-heading';
          h.textContent = pkg;
          section.appendChild(h);
          for (const item of items) {
            const a = document.createElement('a');
            a.className = 'demo-link' + (current?.id === item.id ? ' active' : '');
            a.href = `#${item.id}`;
            a.dataset.id = item.id;
            a.textContent = item.title;
            section.appendChild(a);
          }
          nav.appendChild(section);
        }
      }

      async function activate(id) {
        const item = manifest.examples.find(e => e.id === id) ?? manifest.examples[0];
        if (!item) return;
        current = item;
        sourceDrawer.hidden = true;
        activePkg.textContent = item.package;
        activeTitle.textContent = item.title;
        activeDesc.textContent = item.description ?? '';
        openDirect.href = item.kind === 'node' ? item.source : item.path;
        for (const el of nav.querySelectorAll('.demo-link')) {
          el.classList.toggle('active', el.dataset.id === item.id);
        }
        if (item.kind === 'node') {
          viewer.hidden = true;
          viewer.removeAttribute('src');
          nodeCard.hidden = false;
          nodeDesc.textContent = `${item.title} — Node benchmark / CLI example`;
          nodeCmd.textContent = item.command ?? `node ./${item.package}/...`;
          nodeSource.textContent = await (await fetch(item.source)).text();
          window.__galleryReady = {
            target: manifest.target,
            label: manifest.label,
            count: manifest.examples.length,
            activeId: item.id,
          };
        } else {
          nodeCard.hidden = true;
          viewer.hidden = false;
          await new Promise(resolve => {
            const onLoad = () => {
              viewer.removeEventListener('load', onLoad);
              resolve();
            };
            viewer.addEventListener('load', onLoad);
            viewer.src = item.path;
          });
          window.__galleryReady = {
            target: manifest.target,
            label: manifest.label,
            count: manifest.examples.length,
            activeId: item.id,
          };
        }
      }

      viewSourceBtn.addEventListener('click', async () => {
        if (!current) return;
        sourcePath.textContent = current.source;
        sourceCode.textContent = 'Loading...';
        sourceDrawer.hidden = false;
        sourceCode.textContent = await (await fetch(current.source)).text();
      });

      closeSourceBtn.addEventListener('click', () => {
        sourceDrawer.hidden = true;
      });

      filterInput.addEventListener('input', () => renderNav(filterInput.value));
      window.addEventListener('hashchange', () => {
        activate(location.hash.slice(1));
      });

      renderNav('');
      await activate(location.hash.slice(1));
    </script>
  </body>
</html>
