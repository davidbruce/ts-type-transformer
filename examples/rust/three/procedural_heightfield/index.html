<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural BufferGeometry Heightfield — Three.js + Rust</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #ffffff; color: #111111; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      #app { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
      .head { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111111; padding-bottom: 10px; }
      .head h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .badge { font-size: 11px; color: #111111; background: #f7f7f7; border: 1px solid #b5b5b5; border-radius: 3px; padding: 2px 9px; }
      .card { background: #f7f7f7; border: 1px solid #d4d4d4; border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .label { font-size: 11px; color: #555555; text-transform: uppercase; letter-spacing: 0.06em; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
      button { appearance: none; font: inherit; font-size: 12px; color: #111111; background: #ffffff; border: 1px solid #111111; border-radius: 3px; padding: 5px 10px; cursor: pointer; }
      button:hover { background: #efefef; }
      button:active { background: #111111; color: #ffffff; }
      .stage-box { width: 680px; height: 400px; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; overflow: hidden; }
      .stage-box canvas { display: block; }
      .meta { font-size: 12px; color: #555555; background: #ffffff; border: 1px solid #d4d4d4; border-radius: 3px; padding: 8px 10px; }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="head">
        <h1>Three.js Procedural BufferGeometry Heightfield (Rust)</h1>
        <span class="badge">three · webgl</span>
      </div>
      <div class="card">
        <div class="label">784 Vertices · 1458 Triangles · Float32BufferAttribute · computeVertexNormals · Points</div>
        <div class="toolbar">
          <button id="btn-p0" type="button">Wave: Interference</button>
          <button id="btn-p1" type="button">Wave: Radial Ripple</button>
          <button id="btn-p2" type="button">Wave: Saddle Ridge</button>
          <button id="btn-wire" type="button">Wireframe: On</button>
          <button id="btn-orbit" type="button">Orbit +45°</button>
        </div>
        <div id="stage" class="stage-box"></div>
        <div id="meta" class="meta">Initializing Three.js WebGL scene...</div>
      </div>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
